apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-web-page
  namespace: gjkim

spec:
  replicas: 3

  selector:
    matchLabels:
      app: my-web-page

  template:
    metadata:
      labels:
        app: my-web-page

    spec:
      containers:
        - name: my-apache2
          image: kjkim0823/ubuntu24.04:my-apache2
