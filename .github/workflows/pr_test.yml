name: Lint and Pytest for PR

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, practice-basic-VM]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Install pytest
        run: pip install pytest

      - name: Run ruff
        run: python3 -m ruff check src

      - name: Run pytest
        run: python3 -m pytest tests
